<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width=, initial-scale=1.0">
	<title>Blue</title>

	<style>
		body {
			background-color: #0a0a2e;
			margin: 0;
			padding: 20px;
		}
		h1 {
			color: white;
			text-align: center;
		}
		.gallery {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			justify-content: center;
		}
		.gallery img {
			width: 300px;
			height: 200px;
			object-fit: cover;
			border-radius: 8px;
		}
	</style>
</head>
<body>
	<h1>Blue gallery</h1>
	<div class ="gallery">
		<img src="images/blue.jpg" alt="Photo 1">
		<img src="images/bluee.jpg" alt="Photo 2">
		<img src="images/blueee.jpg" alt="Photo 3">
	</div>
</body>
</html>
